name: Weekly Signal Update

on:
  # Every Monday at 12:00 PM ET = 16:00 UTC (17:00 UTC during EST)
  schedule:
    - cron: '0 16 * * 1'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run signal generator
        run: python update_data.py

      - name: Commit and push data.json
        run: |
          git config user.name  "T-Finance Bot"
          git config user.email "bot@t-finance.app"
          git add data.json
          git diff --staged --quiet || git commit -m "Weekly signals update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
