<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="T-Finance">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="App Icon.jpeg">
<title>T-Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --green: #00C805;
  --red:   #FF5000;
  --hold:  #555555;
  --bg:    #000000;
  --s1:    #111111;
  --s2:    #1C1C1E;
  --s3:    #2C2C2E;
  --border:#1C1C1E;
  --text:  #FFFFFF;
  --text2: #8E8E93;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
  --nav-h: 49px;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; -webkit-font-smoothing:antialiased; overscroll-behavior:none; }

/* ─── LOCK SCREEN ──────────────────────────────────────── */
#lock {
  position:fixed; inset:0; background:var(--bg); z-index:9999;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding-bottom:calc(var(--safe-bot) + 20px);
  transition:opacity .3s ease;
}
#lock.out { opacity:0; pointer-events:none; }
.lock-icon {
  width:72px; height:72px; background:var(--green); border-radius:18px;
  display:flex; align-items:center; justify-content:center; margin-bottom:28px;
}
.lock-icon svg { width:36px; height:36px; }
.lock-h { font-size:26px; font-weight:700; margin-bottom:6px; }
.lock-sub { font-size:14px; color:var(--text2); margin-bottom:44px; }
.pin-dots { display:flex; gap:18px; margin-bottom:44px; }
.dot { width:13px; height:13px; border-radius:50%; border:2px solid var(--text2); transition:all .12s ease; }
.dot.on { background:var(--text); border-color:var(--text); }
.dot.err { background:var(--red); border-color:var(--red); }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-8px)} 80%{transform:translateX(8px)} }
.pin-dots.shake { animation:shake .4s ease; }
.numpad { display:grid; grid-template-columns:repeat(3,78px); gap:14px; }
.nk {
  width:78px; height:78px; border-radius:50%; background:var(--s2); border:none;
  color:var(--text); font-family:inherit; display:flex; flex-direction:column;
  align-items:center; justify-content:center; cursor:pointer;
  transition:transform .08s ease, background .08s ease; user-select:none;
}
.nk:active { transform:scale(.91); background:var(--s3); }
.nk.ghost { background:transparent; }
.nk.ghost:active { background:rgba(255,255,255,.06); }
.nk .d { font-size:27px; font-weight:400; line-height:1; }
.nk .l { font-size:9px; letter-spacing:1.8px; color:var(--text2); margin-top:2px; }

/* ─── APP SHELL ────────────────────────────────────────── */
#app {
  position:fixed; inset:0; display:flex; flex-direction:column; overflow:hidden;
  visibility:hidden; opacity:0; transition:opacity .35s ease;
}
#app.show { visibility:visible; opacity:1; }

/* scroll */
.sv {
  flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--nav-h) + var(--safe-bot) + 20px);
  scroll-behavior:smooth;
}
.sv::-webkit-scrollbar { display:none; }

/* ─── HEADER ────────────────────────────────────────────── */
.hdr {
  padding:calc(var(--safe-top) + 52px) 20px 0;
  background:var(--bg);
}
.hdr-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
.hdr-title { font-size:22px; font-weight:800; }
.hdr-updated { font-size:12px; color:var(--text2); }
.mkt-row { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text2); padding-bottom:14px; }
.mkt-dot { width:7px; height:7px; border-radius:50%; background:var(--green); flex-shrink:0; }
.mkt-dot.cl { background:var(--red); }

/* ─── TIME TABS ─────────────────────────────────────────── */
.tabs { display:flex; gap:2px; padding:0 16px 12px; background:var(--bg); }
.tb {
  flex:1; padding:6px 2px; border:none; background:transparent;
  color:var(--text2); font-family:inherit; font-size:13px; font-weight:600;
  cursor:pointer; border-radius:6px; transition:all .18s ease;
}
.tb.on { background:rgba(0,200,5,.15); color:var(--green); }

/* ─── COUNTDOWN ─────────────────────────────────────────── */
.cd-wrap {
  margin:0 16px 12px; padding:12px 16px; background:var(--s2); border-radius:14px;
  display:flex; align-items:center; justify-content:space-between;
}
.cd-label { font-size:13px; color:var(--text2); }
.cd-val { font-size:15px; font-weight:700; color:var(--green); font-variant-numeric:tabular-nums; }

/* ─── SIGNAL SUMMARY ────────────────────────────────────── */
.sig-row { display:flex; gap:10px; padding:0 16px 14px; }
.sig-pill {
  flex:1; padding:10px 8px; border-radius:12px; background:var(--s2); text-align:center;
}
.sig-pill .sc { font-size:22px; font-weight:700; }
.sig-pill .sl { font-size:11px; color:var(--text2); margin-top:2px; }
.sig-pill.b .sc { color:var(--green); }
.sig-pill.h .sc { color:var(--text2); }
.sig-pill.s .sc { color:var(--red); }

/* ─── SECTION HEADER ────────────────────────────────────── */
.sec-hdr { font-size:20px; font-weight:700; padding:6px 16px 6px; }

/* ─── STOCK LIST ─────────────────────────────────────────── */
.slist { padding:0 16px; }
.srow {
  display:flex; align-items:center; padding:13px 0;
  border-bottom:1px solid var(--border); cursor:pointer;
  opacity:0; animation:fadeUp .32s ease forwards;
  transition:opacity .15s;
}
.srow:last-child { border-bottom:none; }
.srow:active { opacity:.55; }
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.si { flex:0 0 116px; }
.si-ticker { font-size:16px; font-weight:700; }
.si-name { font-size:13px; color:var(--text2); margin-top:2px; max-width:110px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.spark { flex:1; height:42px; padding:0 6px; }
.spark svg { width:100%; height:100%; }
.sbadge {
  flex:0 0 auto; min-width:68px; padding:9px 12px; border-radius:100px;
  font-size:14px; font-weight:700; text-align:center;
}
.sbadge.buy { background:var(--green); color:#000; }
.sbadge.sell { background:var(--red); color:#fff; }
.sbadge.hold { background:var(--s3); color:var(--text2); }

/* ─── BOTTOM NAV ─────────────────────────────────────────── */
.bnav {
  position:fixed; bottom:0; left:0; right:0;
  height:calc(var(--nav-h) + var(--safe-bot));
  background:rgba(0,0,0,.88); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--border);
  display:flex; align-items:flex-start; padding-top:8px; z-index:100;
}
.ni {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  cursor:pointer; padding:2px 0; transition:opacity .15s;
}
.ni:active { opacity:.5; }
.ni-label { font-size:10px; color:var(--text2); }
.ni.on .ni-label { color:var(--green); }
.ni.on svg * { stroke:var(--green) !important; }

/* ─── DETAIL OVERLAY ─────────────────────────────────────── */
#detail {
  position:fixed; inset:0; background:var(--bg); z-index:500;
  transform:translateY(100%); transition:transform .4s cubic-bezier(.32,.72,0,1);
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--nav-h) + var(--safe-bot) + 20px);
}
#detail.open { transform:translateY(0); }
#detail::-webkit-scrollbar { display:none; }

.dh {
  display:flex; align-items:center; justify-content:space-between;
  padding:calc(var(--safe-top) + 52px) 20px 12px;
}
.d-back {
  width:36px; height:36px; border-radius:50%; background:var(--s2);
  border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
  color:var(--text); transition:background .12s;
}
.d-back:active { background:var(--s3); }
.d-ticker { font-size:14px; color:var(--text2); font-weight:600; }
.d-name  { font-size:30px; font-weight:800; padding:0 20px 2px; }
.d-price { font-size:30px; font-weight:700; padding:0 20px 4px; }
.d-chg   { display:flex; align-items:center; gap:8px; padding:0 20px 18px; font-size:15px; font-weight:500; }
.d-chart { width:100%; height:160px; }
.d-chart svg { width:100%; height:100%; }

.dtabs { display:flex; padding:8px 16px 20px; gap:2px; }

.sig-blk {
  margin:0 16px 14px; padding:18px; background:var(--s2); border-radius:16px;
}
.sig-blk-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.sig-blk-lbl { font-size:12px; color:var(--text2); font-weight:600; text-transform:uppercase; letter-spacing:.6px; }
.sbadge-lg { padding:8px 20px; border-radius:100px; font-size:14px; font-weight:700; }
.sbadge-lg.buy { background:var(--green); color:#000; }
.sbadge-lg.sell { background:var(--red); color:#fff; }
.sbadge-lg.hold { background:var(--s3); color:var(--text2); }

.conf-lbl { display:flex; justify-content:space-between; font-size:12px; color:var(--text2); margin-bottom:6px; }
.conf-track { height:4px; background:var(--s3); border-radius:2px; overflow:hidden; margin-bottom:14px; }
.conf-fill  { height:100%; border-radius:2px; width:0; transition:width .9s cubic-bezier(.4,0,.2,1); }
.reason { font-size:14px; color:var(--text2); line-height:1.6; }

.tgrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:0 16px 14px; }
.tcard { background:var(--s2); border-radius:16px; padding:16px; }
.tcard-lbl { font-size:12px; color:var(--text2); margin-bottom:6px; }
.tcard-val { font-size:22px; font-weight:700; }
.tcard-val.pos { color:var(--green); }
.tcard-val.neg { color:var(--red); }

/* skeleton loader */
.skel { background:var(--s2); border-radius:8px; }
@keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:.8} }
.loading .skel { animation:pulse 1.4s ease-in-out infinite; }
</style>
</head>

<script>
// ─── PIN ─────────────────────────────────────────────────
// Default PIN: 1234  (SHA-256 hash)
// Change PIN: in browser console run →
//   hashStr('YOUR_NEW_PIN').then(h => console.log(h))
// then paste result as PIN_HASH below
const PIN_HASH = '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';

let pin = '';

async function hashStr(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2,'0')).join('');
}

window.pk = function(n) {
  if (pin.length >= 4) return;
  pin += n;
  syncDots();
  if (pin.length === 4) verifyPin();
};

window.pdel = function() {
  pin = pin.slice(0,-1);
  syncDots();
};

function syncDots() {
  for (let i=0;i<4;i++) {
    document.getElementById('d'+i).className = 'dot' + (i < pin.length ? ' on' : '');
  }
}

async function verifyPin() {
  const h = await hashStr(pin);
  if (h === PIN_HASH) {
    sessionStorage.setItem('tf_ok','1');
    const lock = document.getElementById('lock');
    lock.classList.add('out');
    setTimeout(() => { lock.style.display='none'; showApp(); }, 320);
  } else {
    const pd = document.getElementById('pinDots');
    document.querySelectorAll('.dot').forEach(d => { d.className='dot err'; });
    pd.classList.add('shake');
    setTimeout(() => {
      pd.classList.remove('shake');
      pin = '';
      syncDots();
    }, 600);
  }
}

// ─── BOOT ────────────────────────────────────────────────
if (sessionStorage.getItem('tf_ok') === '1') {
  document.getElementById('lock').style.display = 'none';
  showApp();
}

function showApp() {
  const app = document.getElementById('app');
  app.classList.add('show');
  init();
}

// ─── STATE ───────────────────────────────────────────────
let stocks = [];
let activePeriod = '1D';

// ─── INIT ─────────────────────────────────────────────────
function init() {
  loadData();
  startClock();
  checkMarket();
  setInterval(checkMarket, 60000);
  wireTabs(document.getElementById('mainTabs'));
  wireTabs(document.getElementById('detailTabs'));
}

// ─── DATA ─────────────────────────────────────────────────
async function loadData() {
  try {
    const r = await fetch('data.json?t=' + Date.now());
    const j = await r.json();
    stocks = j.stocks;
    const d = new Date(j.updated);
    document.getElementById('lastUpd').textContent =
      d.toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  } catch(_) {
    stocks = MOCK;
    document.getElementById('lastUpd').textContent = 'Demo data';
  }
  renderList();
  renderSummary();
}

// ─── RENDER LIST ──────────────────────────────────────────
function renderSummary() {
  document.getElementById('nBuy').textContent  = stocks.filter(s=>s.signal==='BUY').length;
  document.getElementById('nHold').textContent = stocks.filter(s=>s.signal==='HOLD').length;
  document.getElementById('nSell').textContent = stocks.filter(s=>s.signal==='SELL').length;
}

function renderList() {
  const order = {BUY:0,HOLD:1,SELL:2};
  const sorted = [...stocks].sort((a,b) =>
    (order[a.signal]-order[b.signal]) || b.confidence-a.confidence
  );
  document.getElementById('slist').innerHTML = sorted.map((s,i) => `
    <div class="srow" style="animation-delay:${i*35}ms" onclick="openDetail('${s.symbol}')">
      <div class="si">
        <div class="si-ticker">${s.symbol}</div>
        <div class="si-name">${s.name}</div>
      </div>
      <div class="spark">${mkSpark(s.sparkline, s.signal)}</div>
      <div class="sbadge ${s.signal.toLowerCase()}">${s.signal}</div>
    </div>
  `).join('');
}

// ─── SPARKLINE ────────────────────────────────────────────
function mkSpark(pts, sig) {
  if (!pts||pts.length<2) return '';
  const W=100, H=42, pad=3;
  const mn=Math.min(...pts), mx=Math.max(...pts), rng=mx-mn||1;
  const xy = pts.map((v,i)=>[
    (i/(pts.length-1))*W,
    H-pad-((v-mn)/rng)*(H-pad*2)
  ]);
  const path = 'M'+xy.map(p=>p.join(',')).join('L');
  const fill = path+`L${W},${H}L0,${H}Z`;
  const col = sig==='BUY'?'#00C805':sig==='SELL'?'#FF5000':'#555';
  const gid = 'g'+Math.random().toString(36).slice(2,8);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${col}" stop-opacity=".3"/>
      <stop offset="100%" stop-color="${col}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${fill}" fill="url(#${gid})"/>
    <path d="${path}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function mkBigChart(pts, sig) {
  if (!pts||pts.length<2) return '';
  const W=400, H=160, pad=8;
  const mn=Math.min(...pts), mx=Math.max(...pts), rng=mx-mn||1;
  const xy = pts.map((v,i)=>[
    (i/(pts.length-1))*W,
    H-pad-((v-mn)/rng)*(H-pad*2)
  ]);
  // smooth bezier
  let path=`M${xy[0][0]},${xy[0][1]}`;
  for(let i=1;i<xy.length;i++){
    const cx=(xy[i-1][0]+xy[i][0])/2;
    path+=` C${cx},${xy[i-1][1]} ${cx},${xy[i][1]} ${xy[i][0]},${xy[i][1]}`;
  }
  const fill=path+`L${W},${H}L0,${H}Z`;
  const col = sig==='BUY'?'#00C805':sig==='SELL'?'#FF5000':'#555';
  const last = xy[xy.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="overflow:visible">
    <defs>
      <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${col}" stop-opacity=".22"/>
        <stop offset="100%" stop-color="${col}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${fill}" fill="url(#bg2)"/>
    <path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      style="stroke-dasharray:2000;stroke-dashoffset:2000;animation:dl .9s ease forwards"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="${col}"
      style="opacity:0;animation:dp .25s ease .85s forwards;transform-origin:${last[0]}px ${last[1]}px"/>
    <style>
      @keyframes dl{to{stroke-dashoffset:0}}
      @keyframes dp{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
    </style>
  </svg>`;
}

// ─── DETAIL ───────────────────────────────────────────────
function openDetail(sym) {
  const s = stocks.find(x=>x.symbol===sym);
  if (!s) return;
  const pos = s.changePct >= 0;
  const col = s.signal==='BUY'?'var(--green)':s.signal==='SELL'?'var(--red)':'var(--text2)';

  document.getElementById('dTicker').textContent  = s.symbol;
  document.getElementById('dName').textContent    = s.name;
  document.getElementById('dPrice').textContent   = `$${s.price.toFixed(2)}`;
  document.getElementById('dChg').innerHTML = `
    <span style="color:${pos?'var(--green)':'var(--red)'}">
      ${pos?'▲':'▼'} $${Math.abs(s.change).toFixed(2)} (${pos?'+':''}${s.changePct.toFixed(2)}%)
    </span>
    <span style="color:var(--text2)">Today</span>`;
  document.getElementById('dChart').innerHTML = mkBigChart(s.sparkline, s.signal);

  const badge = document.getElementById('dSigBadge');
  badge.textContent = s.signal;
  badge.className = `sbadge-lg ${s.signal.toLowerCase()}`;

  const pct = Math.round(s.confidence*100);
  document.getElementById('dConfPct').textContent = pct+'%';
  const fill = document.getElementById('dConfFill');
  fill.style.width='0'; fill.style.background=col;
  setTimeout(()=>{ fill.style.width=pct+'%'; }, 60);

  document.getElementById('dReason').textContent = s.reason;

  const fmt = v => (v>=0?'+':'')+v.toFixed(2)+'%';
  document.getElementById('dT10').textContent  = fmt(s.trend10d);
  document.getElementById('dT10').className    = 'tcard-val '+(s.trend10d>=0?'pos':'neg');
  document.getElementById('dT100').textContent = fmt(s.trend100d);
  document.getElementById('dT100').className   = 'tcard-val '+(s.trend100d>=0?'pos':'neg');

  document.getElementById('detail').classList.add('open');
  document.getElementById('sv').style.overflow = 'hidden';
}

window.closeDetail = function() {
  document.getElementById('detail').classList.remove('open');
  document.getElementById('sv').style.overflow = '';
};

// ─── TABS ─────────────────────────────────────────────────
function wireTabs(wrap) {
  wrap.querySelectorAll('.tb').forEach(btn => {
    btn.addEventListener('click', function() {
      wrap.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
      this.classList.add('on');
      activePeriod = this.dataset.p;
    });
  });
}

// ─── MARKET + CLOCK ───────────────────────────────────────
function etNow() {
  return new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
}

function checkMarket() {
  const et = etNow();
  const d=et.getDay(), h=et.getHours(), m=et.getMinutes();
  const open = d>=1&&d<=5&&(h>9||(h===9&&m>=30))&&h<16;
  document.getElementById('mktDot').className = 'mkt-dot'+(open?'':' cl');
  document.getElementById('mktTxt').textContent = open ? 'Market open · NYSE' : 'Market closed · NYSE';
}

function startClock() {
  function tick() {
    const et = etNow();
    let target = new Date(et);
    target.setHours(9,30,0,0);
    if (et>=target||et.getDay()===0||et.getDay()===6) {
      target.setDate(target.getDate()+1);
      while(target.getDay()===0||target.getDay()===6) target.setDate(target.getDate()+1);
      target.setHours(9,30,0,0);
    }
    const ms = target-et;
    const h=Math.floor(ms/3600000), min=Math.floor((ms%3600000)/60000), s=Math.floor((ms%60000)/1000);
    document.getElementById('cdVal').textContent = h>0?`${h}h ${min}m`:`${min}m ${s}s`;
  }
  tick();
  setInterval(tick,1000);
}
